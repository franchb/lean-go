[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "lean-go-tools"
version = "0.1.0a5"
description = "Pinned Lean-to-Go extraction and source-proof tools"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "franchb", email = "hello@franchb.com"}]
dependencies = []

[project.scripts]
lean-go = "lean_go.cli:main"

[project.urls]
Repository = "https://github.com/franchb/lean-go"

[tool.hatch.build.targets.wheel]
only-include = ["src/lean_go/__init__.py", "src/lean_go/__main__.py", "src/lean_go/cli.py"]
sources = ["src"]

# Each source is copied byte-for-byte. Additions require an explicit review.
[tool.hatch.build.targets.wheel.force-include]
"cmd/lean-go/main.go" = "lean_go/_payload/cmd/lean-go/main.go"
"feasibility/LeanGo/Feasibility/Model.lean" = "lean_go/_payload/feasibility/LeanGo/Feasibility/Model.lean"
"go.mod" = "lean_go/_payload/go.mod"
"internal/gogen/emit.go" = "lean_go/_payload/internal/gogen/emit.go"
"internal/gogen/identity.go" = "lean_go/_payload/internal/gogen/identity.go"
"internal/gogen/publish.go" = "lean_go/_payload/internal/gogen/publish.go"
"internal/gogen/templates/runtime.go.tmpl" = "lean_go/_payload/internal/gogen/templates/runtime.go.tmpl"
"internal/ir/decode.go" = "lean_go/_payload/internal/ir/decode.go"
"internal/ir/identity.go" = "lean_go/_payload/internal/ir/identity.go"
"internal/ir/types.go" = "lean_go/_payload/internal/ir/types.go"
"internal/ir/validate.go" = "lean_go/_payload/internal/ir/validate.go"

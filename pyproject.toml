"internal/modulegen/api_names.go" = "lean_go/_payload/internal/modulegen/api_names.go"
"internal/modulegen/emit.go" = "lean_go/_payload/internal/modulegen/emit.go"
"internal/modulegen/identity.go" = "lean_go/_payload/internal/modulegen/identity.go"

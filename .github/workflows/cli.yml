name: Installed CLI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  cli-package:
    name: Installed CLI (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Install pinned Lean release (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            --output "$archive"
          printf '%s  %s\n' \
            7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d \
            "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/lean" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean release (Windows)
        if: runner.os == 'Windows'
        run: |
          archive="$RUNNER_TEMP/lean-4.35.0-windows.zip"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-windows.zip \
            --output "$archive"
          printf '%s  %s\n' \
            5fc033e93e1a7bc59c5ebf311103d2c9cd18d4b3eddda4ffa3414e8adb0ef79e \
            "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/lean-4.35.0-windows/bin" >> "$GITHUB_PATH"
      - name: Check CLI boundary and payload parity
        run: uv run --locked python scripts/test_cli.py
      - name: Build, audit and exercise isolated installed wheels
        run: uv run --locked python scripts/check_cli_install.py


name: Installed CLI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOWORK: 'off'

defaults:
  run:
    shell: bash

jobs:
  cli-package:
    name: Installed CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install pinned Lean release (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$RUNNER_TEMP/lean-4.36.0-linux.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst \
            --output "$archive"
          printf '%s  %s\n' \
            2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb \
            "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/lean" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean release (Windows)
        if: runner.os == 'Windows'
        run: |
          archive="$RUNNER_TEMP/lean-4.36.0-windows.zip"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-windows.zip \
            --output "$archive"
          printf '%s  %s\n' \
            5af5f955df6cfe37082d71c56c7d47fe620faa9f59e14b917b43976c08dc676b \
            "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/lean-4.36.0-windows/bin" >> "$GITHUB_PATH"
      - name: Check CLI boundary and the installed-CLI harness
        run: go test -count=1 ./internal/cli/ ./internal/smoke/ ./cmd/lean-go/ ./cmd/lean-go-dev/
      - name: Build, install and exercise the CLI binaries and standalone proof demos
        # go build, and go install from a module archive of the tracked files
        # served by a local proxy; each binary then runs outside the checkout.
        run: go run ./cmd/lean-go-dev installed-cli
      - name: Install and exercise the exact public CLI tag
        if: github.ref_type == 'tag'
        env:
          LEAN_GO_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          bin="$RUNNER_TEMP/public-cli-bin"
          GOBIN="$bin" GOFLAGS=-modcacherw go install "github.com/franchb/lean-go/cmd/lean-go@$LEAN_GO_RELEASE_VERSION"
          cli="$bin/lean-go"
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          go run ./cmd/lean-go-dev installed-cli --cli "$cli" --expect-tag "$LEAN_GO_RELEASE_VERSION"
          (cd examples/proofs/checkedframe && GOPROXY=off go test -count=1 ./... && GOPROXY=off go run .)

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOWORK: 'off'

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.4
          go env CGO_ENABLED GOTOOLCHAIN GOWORK
      - name: Test
        run: go test -count=1 -timeout=25m ./...
      - name: Vet
        run: go vet ./...

  extraction:
    name: Lean extraction (Ubuntu)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_GO_NATIVE: '1'
      LEAN_GO_REGENERATE: '1'
      LEAN_GO_MODULES: '1'
      LEAN_GO_DIFFERENTIAL: '1'
      LEAN_GO_QUOTA: '1'
      LEAN_GO_PROOFS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Install pinned Lean release
        run: |
          archive="$RUNNER_TEMP/lean-4.36.0-rc2-linux.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.36.0-rc2/lean-4.36.0-rc2-linux.tar.zst \
            --output "$archive"
          printf '%s  %s\n' \
            0a0a3208617e9eab92f1041efa83ad94d405e69d172fb654a62dbfa9fbc5313b \
            "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/lean" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Verify extraction toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.4
          uv --version
          test "$(uv --version | cut -d ' ' -f 2)" = 0.13.5
          lean --version
          lake --version
          uv run --locked python - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, 'scripts')
          from export import check_version

          print(sys.version)
          assert sys.version_info[:3] == (3, 15, 1)
          check_version(subprocess.check_output(['lean', '--version'], text=True))
          PY
      - name: Qualify the production compiler against the compatibility corpus
        run: |
          uv run --locked python scripts/check_compatibility.py \
            --baseline-bin "$RUNNER_TEMP/lean/bin" \
            --candidate-bin "$RUNNER_TEMP/lean/bin" \
            --artifacts "$RUNNER_TEMP/lean-go-compatibility"
      - name: Preserve compiler compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-compatibility-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/lean-go-compatibility/report.json
            ${{ runner.temp }}/lean-go-compatibility/**/commands.jsonl
            ${{ runner.temp }}/lean-go-compatibility/inputs.json
            ${{ runner.temp }}/lean-go-compatibility/**/result.json
            ${{ runner.temp }}/lean-go-compatibility/**/identity.json
            ${{ runner.temp }}/lean-go-compatibility/**/adaptations.json
            ${{ runner.temp }}/lean-go-compatibility/differences/**
      - name: Check quota source proofs and generated binding
        run: uv run --locked python scripts/check_quota.py
      - name: Verify release-candidate proof-to-Go walkthrough
        run: uv run --locked python scripts/check_release_candidate.py > "$RUNNER_TEMP/lean-go-candidate-receipt.json"
      - name: Native Lean comparison and fresh regeneration
        run: go test -count=1 -timeout=60m ./...
      - name: Python source admission tests
        run: |
          printf '%s\0' scripts/test_*.py |
            xargs -0 -n 1 -P 3 uv run --locked python
      - name: Generated-program semantic comparison
        run: |
          uv run --locked python scripts/differential.py \
            --seed 0 --seed 1 --width 32 --width 64 --cases 32 \
            --shrink --shrink-attempts 12 \
            --artifacts "$RUNNER_TEMP/lean-go-differential"
      - name: Preserve differential evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/lean-go-differential/**/report.json
            ${{ runner.temp }}/lean-go-differential/**/case-*/**
            ${{ runner.temp }}/lean-go-differential/**/commands.jsonl
            ${{ runner.temp }}/lean-go-differential/**/toolchain.json
            ${{ runner.temp }}/lean-go-differential/**/inputs.json
            ${{ runner.temp }}/lean-go-differential/**/results.json
            ${{ runner.temp }}/lean-go-differential/**/program.ir.json
            ${{ runner.temp }}/lean-go-differential/**/source/*.lean
            ${{ runner.temp }}/lean-go-differential/**/native/*.lean
            ${{ runner.temp }}/lean-go-differential/**/native/lakefile.toml
            ${{ runner.temp }}/lean-go-differential/**/native/lean-toolchain
            ${{ runner.temp }}/lean-go-differential/**/consumer/go.mod
            ${{ runner.temp }}/lean-go-differential/**/consumer/*.go
            ${{ runner.temp }}/lean-go-differential/**/consumer/extracted/*.go
            ${{ runner.temp }}/lean-go-differential/**/consumer/extracted/manifest.json
      - name: Preserve candidate walkthrough receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-walkthrough-receipt
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/lean-go-candidate-receipt.json

  tagged-consumer:
    name: Tagged consumer (${{ matrix.os }})
    # Tag only commits whose branch checks already passed.
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.4
          go env CGO_ENABLED GOTOOLCHAIN GOWORK
      - name: Fetch and exercise the exact public module tag
        env:
          LEAN_GO_RELEASE_VERSION: ${{ github.ref_name }}
        run: go test -count=1 -timeout=25m -run '^TestTaggedReleaseConsumer$' -v ./integration
